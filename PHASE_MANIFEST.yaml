schema_version: 3
phase: RG-R05
lifecycle: ACTIVE
deliverables:
  - verified_policy_input
  - typed_policy_dsl
  - policy_evaluator
  - visual_policy_builder
  - extension_sandbox
  - immutable_policy_decision_sets
  - resource_controls
  - policy_studio_ui
  - acceptance_evidence
acceptance_gates:
  - id: policy_input_authority
    requirement: Policy evaluation consumes only registered READY RG-R02 feature sets, RG-R03 decision sets, and RG-R04 inference records that resolve to one common lineage root, a single RG-R02 feature-set identity and output hash, reached directly, through a decision set's bound feature set, or through an inference record's declared FEATURE_SET or DECISION_SET input. All bound records must share that root's target symbol and timeframe and an identical ordered sequence of UTC decision timestamps and row count, verified by row fingerprints and output hashes. Record IDs of different kinds are never compared as if interchangeable, a shared symbol and timeframe alone is not sufficient, every input is re-verified at consumption and around every read, and no feature, decision, or model output is recomputed and no market bar is synthesized.
    evidence: Tests accept compatible lineage through every path (a feature set, a decision set over it, and inference records over either), and refuse diverging ancestry, the same symbol and timeframe from a different feature set, row-count, timestamp, or row-order mismatch, and blocked, quarantined, missing, tampered, stale, and changed-identity inputs, with diagnostics naming the mismatching identity; evaluation reads verified private copies only.
  - id: typed_policy_dsl
    requirement: The policy language has a versioned, documented grammar of typed expressions over declared inputs, with bounded source size, nesting depth, and evaluation cost, a deterministic canonical form, and no file, network, process, environment, clock, or randomness access; unknown or ill-typed constructs are rejected with located diagnostics.
    evidence: Parser and type-checker tests cover the grammar, canonical round trips, every bound, type errors, and unknown constructs, and generated or malformed sources never panic or exceed their bounds.
  - id: policy_decision_semantics
    requirement: Each evaluation emits exactly one BUY, SELL, or SKIP research decision per target closed bar with explicit reason codes, decision origin, and input lineage, and the same policy over the same inputs always yields identical decisions. An upstream RG-R03 SKIP, a SKIPPED or INVALID_OUTPUT inference row, or a missing value reaches the policy as unavailable input with its upstream reason and is never imputed, defaulted, or fabricated.
    evidence: Golden decisions are compared with hand-calculated independent references, including rule precedence, threshold equality, every SKIP reason, propagation of upstream SKIP and of SKIPPED and INVALID_OUTPUT inference rows, and conflicting rules that never emit BUY and SELL for one bar.
  - id: causal_no_lookahead
    requirement: A policy decision at a target bar uses only feature, decision, and inference values whose data inputs were available at that bar's UTC decision time, and never a future row, future label, or unfinished higher-timeframe reference. Causal availability refers to the data an inference consumed, not to when it was computed; inference records are retrospective research computations whose wall-clock generation time is carried into policy lineage, and no output claims that a model result was physically available at the historical decision time.
    evidence: Perturbation tests change future target, reference, and inference rows and prove that every earlier policy decision and its digest is unchanged, and lineage tests show policy outputs carry each inference record's generation time and are labeled as retrospective research.
  - id: policy_authority_boundary
    requirement: The authority of an RG-R04 model and its inference records stays ADVISORY_ONLY and is never changed by a policy. A policy consumes an inference record only through one role from a closed, versioned policy-consumption allowlist, declared per model input and recorded per decision in lineage. FILTER_VETO may turn an RG-R03 BUY or SELL into SKIP but never inverts a decision, creates BUY or SELL, or changes a SKIP. INDEPENDENT_RESEARCH_SIGNAL may produce a model-origin BUY or SELL research signal, recorded with that origin and its source inference record in a new derived policy decision set. Any other declared role, including DECISION_OVERRIDE, POSITION_SIZING, ORDER_GENERATION, and CHAMPION_PROMOTION, is refused. Policy outputs never modify or promote an RG-R03 decision set or RG-R04 inference record, size a position, emit or route an order, contact a broker or MT5, or promote a Champion.
    evidence: Tests refuse undeclared and unknown roles and explicitly declared but disallowed roles (DECISION_OVERRIDE, POSITION_SIZING, ORDER_GENERATION, CHAMPION_PROMOTION); show FILTER_VETO never inverts or creates a decision; show every model-origin decision records its INDEPENDENT_RESEARCH_SIGNAL role and source inference record; show upstream decision sets and inference records stay byte-identical with ADVISORY_ONLY authority; and show no order, broker, MT5, sizing, or Champion-promotion interface exists.
  - id: visual_policy_builder
    requirement: The visual policy builder edits the same typed policy model as the text language, emits only canonical source that the parser accepts, round-trips every valid policy without semantic change, and cannot express a construct the language rejects.
    evidence: Builder tests show text-to-builder and builder-to-text round trips, identical policy identities for equivalent text and visual edits, and validation errors surfaced in the builder.
  - id: isolated_extensions
    requirement: Extensions are registered by content digest after explicit confirmation, declare a typed interface, and run isolated with no file system, network, process, environment, clock, or randomness access under instruction, memory, and time limits; an extension whose content changes is quarantined, never silently re-identified.
    evidence: Adversarial extension fixtures attempting file, network, process, and clock access, unbounded loops, and memory exhaustion are refused or stopped within their limits with diagnostics, and digest-drift tests quarantine the extension.
  - id: immutable_policy_materialization
    requirement: Policy decision-set identity binds the canonical policy source and language version, extension digests, input identities and hashes, and temporal semantics to canonical sorted decision rows with a digest, through staged preview, explicit confirmation, and atomic promotion.
    evidence: Tests verify staged preview, confirmation, crash-recoverable promotion, idempotent replay with byte-identical output, and new identities for any changed policy, extension, or input.
  - id: resource_cancel_recovery
    requirement: Policy evaluation and extension calls run off the UI thread in bounded batches with row and byte quotas, per-call extension limits, progress, cancellation, and safe recovery after interruption.
    evidence: Capacity, quota, cancellation, extension-limit, and interrupted-promotion restart tests leave no partial registered policy, extension, or decision set.
  - id: desktop_policy_studio_ipc
    requirement: The desktop flow authors a policy in text or with the visual builder, validates it, selects verified inputs, previews and confirms decisions with SKIP reasons, and inspects lineage and declared authorities.
    evidence: Tauri IPC and frontend tests exercise the asynchronous flow, validation and error states, cancellation, and results without layout redesign or fabricated decisions.
  - id: adversarial_tamper
    requirement: Tampered policy definitions, extension modules, decision outputs or manifests, and tampered upstream feature sets, decision sets, or inference records are quarantined and cannot be consumed or reported as READY.
    evidence: Checksum tamper, digest drift, missing-file, malicious-extension, and post-registration upstream tamper tests fail closed with diagnostics naming the affected identity.
  - id: reproducible_acceptance
    requirement: Acceptance evidence records all declared gates against an exact clean commit and tree with source revision and reproducible toolchain.
    evidence: PowerShell and GitHub CI reports, per-gate logs, checksums, artifact identity, workflow status, and source SHA/tree agree exactly.
  - id: owner_ui_acceptance
    requirement: Owner reviews the RG-R05 Policy Studio workflow separately from automated fixture and IPC tests.
    evidence: Manual UI review is explicitly recorded as pending, waived, or accepted and is never inferred from compilation or component tests.

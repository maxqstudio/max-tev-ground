schema_version: 3
phase: RG-R02
lifecycle: ACTIVE
deliverables:
  - verified_input_authority
  - indicator_registry
  - causal_feature_engine
  - multi_timeframe_joins
  - immutable_feature_sets
  - resource_controls
  - feature_studio_ui
  - acceptance_evidence
acceptance_gates:
  - id: input_authority
    requirement: Feature computation accepts only READY verified immutable Data Ground datasets with matching lineage and content hashes.
    evidence: Tests reject missing, blocked, quarantined, unverified, and tampered dataset identities while preserving the source snapshot unchanged.
  - id: indicator_registry
    requirement: Native Rust indicator definitions declare stable identity, version, typed parameters, required inputs, warmup, and deterministic outputs.
    evidence: Registry tests validate parameter schemas, bounds, warmup requirements, deterministic identities, and supported indicator metadata.
  - id: causal_availability
    requirement: Feature rows use only bars available by their explicit UTC decision boundary and never backfill warmup or future values.
    evidence: Boundary tests cover closed-bar inclusion, open and close timestamps, late data, null warmup, finite output, and causal rolling windows.
  - id: multi_market_timeframe
    requirement: Reference series use deterministic as-of joins with explicit staleness limits and never expose unfinished higher-timeframe bars.
    evidence: Multi-series tests cover equal timestamps, suffix symbols, missing series, stale references, market calendars, and incomplete H4 bars.
  - id: feature_materialization
    requirement: Feature-set identity binds immutable inputs, engine version, parameters, temporal semantics, and canonical output checksums.
    evidence: Replays, parameter changes, lineage, sorted output, manifest hashes, atomic promotion, and source immutability are verified.
  - id: resource_controls
    requirement: Processing is bounded, cancellable, observable, and safe for large datasets without unbounded UI memory use.
    evidence: Capacity tests verify batches, quotas, cancellation, backpressure, progress, finite values, overflow handling, and failure recovery.
  - id: feature_studio_ui
    requirement: The UI provides truthful dataset selection, typed registry configuration, preview, explicit confirmation, progress, cancellation, and lineage inspection.
    evidence: Tauri and frontend tests exercise asynchronous source-backed flows, errors, cancellation, and resulting feature-set metadata without fixture claims.
  - id: data_policy
    requirement: Synthetic fixtures are clearly labeled for deterministic tests and arbitrary MT5 Common files are never selected or treated as trusted research input.
    evidence: Fixture labels and selection tests prove test data is not presented as market evidence and no automatic filesystem import occurs.
  - id: golden_vector_math
    requirement: Indicator formulas, initialization, warmup, and edge cases match independently specified golden vectors.
    evidence: Hand-calculated or independently implemented vectors cover flat, zero, missing, duplicate, invalid parameter, warmup, and deterministic repeat cases.
  - id: adversarial_no_lookahead
    requirement: Future or not-yet-available reference bars cannot alter historical feature values at or before the decision boundary.
    evidence: Perturbation tests compare prior feature rows and hashes while varying future target and late multi-timeframe reference observations.
  - id: recovery_and_tamper
    requirement: Feature persistence recovers transactionally after interruption and rejects tampered outputs or changed immutable identities.
    evidence: Migration rollback, partial-write restart, checksum tamper, cancel, changed-configuration identity, and idempotent replay tests pass.
  - id: reproducible_acceptance
    requirement: Acceptance evidence records all declared gates against an exact clean commit and tree with source revision and reproducible toolchain.
    evidence: PowerShell and GitHub CI reports, per-gate logs, checksums, artifact identity, workflow status, and source SHA/tree agree exactly.
  - id: owner_ui_acceptance
    requirement: Owner reviews the RG-R02 Feature Studio workflow separately from automated fixture and IPC tests.
    evidence: Manual UI review is explicitly recorded as pending, waived, or accepted and is never inferred from compilation or component tests.

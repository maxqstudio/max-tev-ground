[workspace]
members = [
  "crates/rg-contracts",
  "crates/rg-data-ground",
  "crates/rg-governance",
  "crates/rg-persistence",
  "src-tauri",
]
default-members = [
  "crates/rg-contracts",
  "crates/rg-data-ground",
  "crates/rg-governance",
  "crates/rg-persistence",
  "src-tauri",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
serde_yaml_ng = "=0.10.0"
sha2 = "=0.11.1"
thiserror = "=2.0.21"
uuid = { version = "=1.28.0", features = ["serde", "v7"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
tempfile = "=3.27.0"
arrow = "=60.0.0"
chrono = { version = "=0.4.45", features = ["serde"] }
csv = "=1.4.0"
parquet = { version = "=60.0.0", features = ["arrow"] }
tauri = { version = "=2.12.4", default-features = false, features = ["wry", "compression", "dynamic-acl", "x11", "dbus", "test"] }
tauri-build = "=2.7.3"
tauri-plugin-dialog = "=2.8.3"

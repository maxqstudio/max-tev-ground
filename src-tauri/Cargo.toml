[package]
name = "max-research-ground-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "max_research_ground_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
rg-data-ground = { path = "../crates/rg-data-ground" }
rg-feature-studio = { path = "../crates/rg-feature-studio" }
rg-governance = { path = "../crates/rg-governance" }
rg-model-registry = { path = "../crates/rg-model-registry" }
rg-persistence = { path = "../crates/rg-persistence" }
rg-strategy-engine = { path = "../crates/rg-strategy-engine" }
serde.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
uuid.workspace = true

[dev-dependencies]
rg-model-registry = { path = "../crates/rg-model-registry", features = ["test-fixtures"] }
serde_json.workspace = true
tempfile.workspace = true

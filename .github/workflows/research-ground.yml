name: MAX Research Ground CI

on:
  push:
    branches:
      - "**"
  pull_request: {}
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-ground-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-foundation:
    name: Windows foundation checks
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      evidence_artifact_id: ${{ steps.upload_evidence.outputs.artifact-id }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.19.0
          cache: npm

      - name: Set up pinned Rust toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Rust toolchain installation failed' }
          rustc --version
          if ($LASTEXITCODE -ne 0) { throw 'rustc is unavailable' }
          node --version
          if ($LASTEXITCODE -ne 0) { throw 'Node.js is unavailable' }
          npm install --global npm@11.17.0
          if ($LASTEXITCODE -ne 0) { throw 'Pinned npm installation failed' }
          if ((npm --version).Trim() -ne '11.17.0') { throw 'npm version does not match package.json' }

      - name: Import MSVC developer environment
        id: msvc_import
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $programFilesX86 = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
          $vswhere = Join-Path $programFilesX86 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) { throw 'Visual Studio vswhere.exe is unavailable' }
          $vsPath = (& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          if (-not $vsPath) { throw 'MSVC x64 C++ Build Tools are unavailable' }
          $vsDevCmd = Join-Path $vsPath 'Common7\Tools\VsDevCmd.bat'
          if (-not (Test-Path -LiteralPath $vsDevCmd)) { throw 'VsDevCmd.bat is unavailable' }
          $quote = [char]34
          $commandLine = "call $quote$vsDevCmd$quote -no_logo -arch=x64 -host_arch=x64 >nul && set"
          $environmentLines = & $env:ComSpec /d /s /c $commandLine
          if ($LASTEXITCODE -ne 0) { throw 'VsDevCmd.bat failed to initialize MSVC' }
          $exports = [System.Collections.Generic.List[string]]::new()
          foreach ($line in $environmentLines) {
            $separator = $line.IndexOf('=')
            if ($separator -gt 0) {
              $name = $line.Substring(0, $separator)
              $value = $line.Substring($separator + 1)
              if ($value.Contains("`n") -or $value.Contains("`r")) { throw "Environment variable $name contains a newline" }
              Set-Item -Path "Env:$name" -Value $value
              $exports.Add("$name=$value")
            }
          }
          [System.IO.File]::AppendAllLines($env:GITHUB_ENV, $exports, [System.Text.UTF8Encoding]::new($false))
          if (-not (Get-Command cl.exe -ErrorAction SilentlyContinue)) { throw 'MSVC compiler was not added to PATH' }

      - name: Verify exact event source
        id: source_check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $head = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve checked-out source SHA' }
          $tree = (git rev-parse 'HEAD^{tree}').Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve checked-out Git tree SHA' }
          $dirty = @(git status --porcelain --untracked-files=normal)
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect checkout status' }
          Write-Host "SOURCE_SHA=$head"
          Write-Host "SOURCE_TREE=$tree"
          if ($head -ne $env:GITHUB_SHA) { throw "Checked out $head but event requested $env:GITHUB_SHA" }
          if ($dirty.Count -gt 0) { throw 'Checkout was not clean before validation' }

      - name: CI evidence contract tests
        id: evidence_contract_tests
        shell: pwsh
        run: ./scripts/Test-CiEvidence.ps1

      - name: Desktop launcher regression tests
        id: desktop_launcher_tests
        shell: pwsh
        run: ./scripts/Test-DesktopLauncher.ps1

      - name: Rust formatting
        id: rust_fmt
        shell: pwsh
        run: cargo fmt --all -- --check

      - name: Roadmap governance
        id: roadmap_governance
        shell: pwsh
        run: cargo run --locked -p rg-governance --bin rg-governance -- --check

      - name: Verify reproducible phase evidence envelope
        id: reproducible_acceptance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $head = (git rev-parse HEAD).Trim()
          $tree = (git rev-parse 'HEAD^{tree}').Trim()
          if ($head -ne $env:GITHUB_SHA) { throw 'Acceptance evidence is not bound to the event SHA' }
          if ($tree -notmatch '^[0-9a-f]{40,64}$') { throw 'Git tree SHA is invalid' }
          $dirty = @(git status --porcelain --untracked-files=normal)
          if ($dirty.Count -ne 0) { throw 'Acceptance requires an exact clean checkout' }
          cargo run --locked -p rg-governance --bin rg-governance -- --check

      - name: Rust workspace tests
        id: rust_tests
        shell: pwsh
        run: cargo test --workspace --locked

      - name: Rust lint
        id: rust_clippy
        shell: pwsh
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rust workspace build
        id: rust_build
        shell: pwsh
        run: cargo build --workspace --locked

      - name: Frontend clean install
        id: npm_ci
        shell: pwsh
        run: npm ci --no-audit --no-fund

      - name: Frontend lint
        id: frontend_lint
        shell: pwsh
        run: npm run lint

      - name: Frontend typecheck
        id: frontend_typecheck
        shell: pwsh
        run: npm run typecheck

      - name: Frontend unit tests
        id: frontend_tests
        shell: pwsh
        run: npm test -- --run

      - name: Frontend production build
        id: frontend_build
        shell: pwsh
        run: npm run build

      - name: Phase gate-traceable tests
        id: phase_gate_tests
        shell: pwsh
        run: ./scripts/Invoke-PhaseGateTests.ps1 -EvidenceDirectory (Join-Path $env:RUNNER_TEMP 'research-ground-evidence')

      - name: Tauri Windows desktop build
        id: tauri_build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP 'research-ground-tauri-target'
          npm run tauri -- build --no-bundle

      - name: Write source-bound acceptance evidence
        if: always()
        shell: pwsh
        env:
          RG_STEP_source_check: ${{ steps.source_check.outcome }}
          RG_STEP_evidence_contract_tests: ${{ steps.evidence_contract_tests.outcome }}
          RG_STEP_rust_fmt: ${{ steps.rust_fmt.outcome }}
          RG_STEP_roadmap_governance: ${{ steps.roadmap_governance.outcome }}
          RG_STEP_reproducible_acceptance: ${{ steps.reproducible_acceptance.outcome }}
          RG_STEP_rust_tests: ${{ steps.rust_tests.outcome }}
          RG_STEP_rust_clippy: ${{ steps.rust_clippy.outcome }}
          RG_STEP_rust_build: ${{ steps.rust_build.outcome }}
          RG_STEP_npm_ci: ${{ steps.npm_ci.outcome }}
          RG_STEP_frontend_lint: ${{ steps.frontend_lint.outcome }}
          RG_STEP_frontend_typecheck: ${{ steps.frontend_typecheck.outcome }}
          RG_STEP_frontend_tests: ${{ steps.frontend_tests.outcome }}
          RG_STEP_frontend_build: ${{ steps.frontend_build.outcome }}
          RG_STEP_msvc_import: ${{ steps.msvc_import.outcome }}
          RG_STEP_tauri_build: ${{ steps.tauri_build.outcome }}
          RG_GATE_reproducible_acceptance: ${{ steps.reproducible_acceptance.outcome }}
        run: ./scripts/New-CiEvidence.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'research-ground-evidence')

      - name: Upload acceptance evidence
        id: upload_evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: research-ground-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/research-ground-evidence/
          if-no-files-found: error
          retention-days: 90

  attest-evidence:
    name: Attest acceptance evidence
    needs: windows-foundation
    if: always() && needs.windows-foundation.outputs.evidence_artifact_id != '' && github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.ref == 'refs/heads/work/rg-r02-feature-studio')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      attestations: write
      id-token: write
      artifact-metadata: write
    steps:
      - name: Download acceptance evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: research-ground-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/research-ground-evidence

      - name: Verify acceptance evidence checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidenceDirectory = Join-Path $env:RUNNER_TEMP 'research-ground-evidence'
          $reportPath = Join-Path $evidenceDirectory 'acceptance.json'
          $checksumPath = Join-Path $evidenceDirectory 'SHA256SUMS.txt'
          if (-not (Test-Path -LiteralPath $reportPath) -or -not (Test-Path -LiteralPath $checksumPath)) { throw 'Acceptance evidence files are incomplete' }
          $line = (Get-Content -LiteralPath $checksumPath -Raw).Trim()
          if ($line -notmatch '^([0-9a-f]{64})  acceptance\.json$') { throw 'Checksum manifest format is invalid' }
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $reportPath).Hash.ToLowerInvariant()
          if ($actual -ne $Matches[1]) { throw 'Acceptance report checksum does not match' }

      - name: Attest source-bound acceptance report
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/research-ground-evidence/acceptance.json
